# @package _global_
defaults:
  - /task/g1_walk_flat/multisim_base
  - _self_

training:
  sim_backend: multisim
  device: cuda:0
  source_timing:
    enabled: true
  multi_source:
    options:
      startup_timeout_s: 600.0
      operation_timeout_s: 120.0
      shutdown_timeout_s: 10.0
    sources:
      - name: isaacgym
        backend: isaacgym
        num_envs: 2000
        seed_offset: 1
        env:
          isaacgym_device_id: 0
          isaacgym_worker_timeout_s: 600.0
      - name: isaacsim
        backend: isaacsim
        num_envs: 2000
        seed_offset: 2
        env:
          isaacsim_device_id: 0
          isaacsim_worker_timeout_s: 600.0
          isaacsim_render_mode: none
      - name: motrix
        backend: motrix
        num_envs: 2000
        seed_offset: 3
        env: {}
      - name: genesis
        backend: genesis
        num_envs: 2000
        seed_offset: 4
        env:
          genesis_device_id: 0
          genesis_integrator: implicitfast
algo:
  num_envs: 8000
