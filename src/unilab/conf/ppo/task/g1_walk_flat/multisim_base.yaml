# @package _global_
defaults:
  - /task/g1_walk_flat/base
  - _self_

training:
  task_name: G1WalkFlat
  no_play: true
  play_render_mode: none
algo:
  num_envs: 2000
  max_iterations: 2200
  empirical_normalization: false
  obs_groups:
    actor: [actor]
    critic: [critic]
  policy:
    actor_hidden_dims: [512, 256, 128]
    critic_hidden_dims: [512, 256, 128]
  algorithm:
    disable_finite_checks: false
env:
  commands:
    twist:
      ranges:
        lin_vel_x: [0.4, 0.7]
        lin_vel_y: [0.0, 0.0]
        ang_vel_z: [0.0, 0.0]
  events:
    base_mass:
      func: unilab.envs.mdp.randomize_rigid_body_mass
      mode: reset
      params:
        asset_cfg:
          _target_: unilab.managers.SceneEntityCfg
          name: robot
          body_names: [pelvis]
        mass_distribution_params: [0.8, 1.2]
        operation: scale
        distribution: uniform
        recompute_inertia: false
play_profile:
  enabled: false
